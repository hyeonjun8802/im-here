name: Quest four-choice responsive UI smoke test
on:
  push:
    branches: [feature/premium-hud-v1000-integrated-20261107]
    paths:
      - src/eventBoard.js
      - src/eventBoard.css
      - src/main.js
      - src/scavengeDirector.js
      - src/supportCompanion.js
      - scripts/qa_quests_v1100.mjs
      - .github/workflows/quests-v1100.yml
  workflow_dispatch:
jobs:
  quest-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Start local Vite
        run: |
          npm run dev -- --host 127.0.0.1 >/tmp/afterday-quests.log 2>&1 &
          for i in $(seq 1 45); do if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/afterday-quests.log
          exit 1
      - run: node scripts/qa_quests_v1100.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: afterday-quests-v1100
          path: docs/qa/quests-v1100/
