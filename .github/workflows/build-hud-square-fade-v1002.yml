name: Build approved square-fade HUD PNG assets
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-hud-square-fade-v1002.yml
      - scripts/generate_hud_square_fade_v1002.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: square-fade-hud-v1002
  cancel-in-progress: false
jobs:
  build-hud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PNG tooling
        run: python -m pip install "Pillow==11.3.0"
      - name: Generate four original-material-based PNGs
        run: python scripts/generate_hud_square_fade_v1002.py
      - name: Verify dimensions and transparency
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          folder=Path('public/assets/ui/hud-square-fade')
          expected={'compact_a':(1000,210),'compact_b':(1700,190),'full_a':(1700,350),'full_b':(1700,380)}
          for name,size in expected.items():
              p=folder/f'hud_{name}_square_fade.png'
              image=Image.open(p)
              assert image.size==size,(p,image.size)
              assert image.mode=='RGBA',(p,image.mode)
              assert image.getbbox() is not None,p
              print('OK:',p,image.size)
          PY
      - name: Commit PNG assets without overwriting originals
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/ui/hud-square-fade/*.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(hud): render approved low-glare square end PNG variants"
            git push origin HEAD:main
          else
            echo "PNG assets are already current"
          fi
