name: AFTERDAY 9.4 — Linear HUD real browser screenshots
on:
  push:
    branches:
      - main
      - feature/forecast-linear-bar-v940-20261106
      - feature/unified-survival-hud-v950-20261106
      - feature/mobile-weather-art-v960-20261106
      - feature/slim-weather-hud-v970-20261106
      - feature/frostpunk-hud-art-v980-20261106
    paths:
      - 'src/style.css'
      - 'src/disasterForecastV800.js'
      - 'index.html'
      - 'public/assets/ui/disaster_forecast_frame.svg'
      - 'public/assets/ui/forecast_hud_frame_v950.svg'
      - 'public/assets/ui/forecast_hud_mobile_v960.svg'
      - 'public/assets/ui/forecast_hud_frame_v970.svg'
      - 'public/assets/ui/forecast_hud_mobile_v970.svg'
      - 'public/assets/ui/forecast_hud_desktop_v980.svg'
      - 'public/assets/ui/forecast_hud_mobile_v980.svg'
      - 'public/assets/ui/weather-premium/*.svg'
      - 'public/assets/ui/hud_*.svg'
      - 'scripts/qa_forecast_bar_v940.mjs'
      - 'scripts/qa_unified_hud_v950.mjs'
      - 'scripts/qa_ios_weather_v960.mjs'
      - 'scripts/qa_live_weather_v960.mjs'
      - '.github/workflows/forecast-hud-visual-v940.yml'
  workflow_dispatch:
jobs:
  hud-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install browser for real screenshots
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Start game server
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/afterday-v940.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/afterday-v940.log
          exit 1
      - name: Capture unified mobile and desktop HUD at three disaster distances
        run: node scripts/qa_unified_hud_v950.mjs
      - name: Capture actual mobile WebKit layout and nine-icon asset gallery
        run: node scripts/qa_ios_weather_v960.mjs
      - name: Attempt actual mobile and desktop 3D game screenshots (software WebGL diagnostic)
        id: gpu-visual
        continue-on-error: true
        run: node scripts/qa_live_weather_v960.mjs
      - name: Report unverified software-GPU capture explicitly
        if: steps.gpu-visual.outcome == 'failure'
        run: echo "::warning::Full 3D scene screenshot could not be verified on GitHub's software WebGL runner. Chromium and WebKit real HUD tests run separately and must pass."
      - name: Publish screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afterday-mobile-hud-art-v960
          path: |
            docs/qa/unified-hud-v950/
            docs/qa/ios-weather-v960/
            docs/qa/live-weather-v960/
          if-no-files-found: warn
          retention-days: 14
