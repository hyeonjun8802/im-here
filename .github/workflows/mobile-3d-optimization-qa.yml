name: Mobile 3D optimization quality QA
on:
  push:
    branches:
      - mobile-3d-optimization
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-3d-optimization-branch
  cancel-in-progress: true
jobs:
  mobile-3d-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Unit tests and Vite build
        run: npm ci && npm run build
      - name: Install QA Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run local game
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/afterday-mobile3d.log 2>&1 &
          for i in $(seq 1 85); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/afterday-mobile3d.log; exit 1
      - name: Check actual mobile WebGL low-auto-high quality and capture
        run: node scripts/qa_mobile3d_optimization.mjs
      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: afterday-mobile3d-optimization-evidence
          path: docs/qa/mobile-3d-optimization/
          if-no-files-found: warn
          retention-days: 14
      - name: Report local dev error on failure
        if: failure()
        run: tail -n 100 /tmp/afterday-mobile3d.log || true
