name: One-time outdated branch pruning after reviewed frontend cleanup
on:
  push:
    branches: [main]
    paths:
      - 'scripts/prune_remote_branches_20261108.mjs'
permissions:
  contents: write
jobs:
  prune:
    if: startsWith(github.event.head_commit.message, 'chore(cleanup):')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Keep only main and the two most recently updated user branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/prune_remote_branches_20261108.mjs
      - name: Publish removed branches with original SHAs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deleted-branch-sha-record
          path: reports/maintenance/branch-prune-report-20261108.json
          retention-days: 60
          if-no-files-found: warn
