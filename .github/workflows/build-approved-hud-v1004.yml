name: Build user-approved HUD v1004 transparent assets
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-approved-hud-v1004.yml
      - scripts/generate_approved_hud_v1004.py
      - scripts/hud-v1004/**
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-approved-hud-v1004
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install "Pillow==11.3.0"
      - name: Restore checksum-protected approved artwork and build 4 images
        run: python scripts/generate_approved_hud_v1004.py
      - name: Publish approved assets to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/ui/hud-approved-v1004/*.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(hud): add 4 user-approved v1004 PNG variants"
            git push origin HEAD:main
          else
            echo "v1004 PNG assets already up-to-date"
          fi
