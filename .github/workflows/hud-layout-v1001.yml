name: AFTERDAY HUD PC mobile layout inspection (no WebGL)
on:
  push:
    branches: [feature/premium-hud-v1000-integrated-20261107]
    paths:
      - scripts/qa_hud_layout_v1001.mjs
      - .github/workflows/hud-layout-v1001.yml
  workflow_dispatch:
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Start Vite
        run: |
          npm run dev -- --host 127.0.0.1 >/tmp/afterday-hud-layout.log 2>&1 &
          for i in $(seq 1 45); do if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/afterday-hud-layout.log
          exit 1
      - name: Measure text ink against flex boxes at five responsive widths
        run: node scripts/qa_hud_layout_v1001.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: afterday-hud-layout-v1001
          path: docs/qa/hud-layout-v1001/
          if-no-files-found: warn
