name: AFTERDAY premium HUD one-screen WebGL diagnostic
on:
  push:
    branches: [feature/premium-hud-v1000-integrated-20261107]
    paths:
      - 'scripts/qa_hud_diagnostic_v1000.mjs'
      - '.github/workflows/premium-hud-v1000-diagnostic.yml'
  workflow_dispatch:
jobs:
  mobile-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Run actual game
        run: |
          npm run dev -- --host 127.0.0.1 >/tmp/afterday-hud-diagnostic.log 2>&1 &
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/afterday-hud-diagnostic.log
          exit 1
      - name: Diagnose real WebGL HUD
        run: node scripts/qa_hud_diagnostic_v1000.mjs
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afterday-premium-hud-mobile-diagnostic
          path: docs/qa/premium-hud-diagnostic-v1000/
          if-no-files-found: warn
