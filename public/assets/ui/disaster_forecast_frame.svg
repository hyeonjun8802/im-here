<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="AFTERDAY disaster forecast frame — linear stages">
<defs>
 <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#626e72"/><stop offset=".16" stop-color="#263137"/><stop offset=".52" stop-color="#111b21"/><stop offset=".84" stop-color="#2f383b"/><stop offset="1" stop-color="#0a1116"/></linearGradient>
 <linearGradient id="brass" x1="0" x2="1"><stop stop-color="#745942"/><stop offset=".24" stop-color="#c69d67"/><stop offset=".52" stop-color="#534130"/><stop offset=".79" stop-color="#d0a56c"/><stop offset="1" stop-color="#624b36"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#34434b"/><stop offset=".38" stop-color="#18252b"/><stop offset="1" stop-color="#0a1319"/></linearGradient>
 <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#000" flood-opacity=".68"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<g filter="url(#shadow)">
 <!-- Retain the observatory's silhouette, palette and surface finish. Only the giant dial
      and its five circular step sockets become one legible bar with square divisions. -->
 <path d="M40 132 110 92h963l82 44-29 90-72 41H102l-65-46z" fill="url(#steel)" stroke="#080d10" stroke-width="13"/>
 <path d="M51 139 122 103h943l75 37-24 75-68 40H111l-61-39z" fill="none" stroke="url(#brass)" stroke-width="6"/>
 <path d="M90 125h1026M110 245h994" stroke="#a0abb0" stroke-opacity=".18" stroke-width="3"/>
 <!-- Current weather uses a horizontal recessed plate; no circular dial. -->
 <path d="M84 139 107 117h315l19 21v82l-24 24H111l-27-23z" fill="url(#glass)" stroke="#8c7352" stroke-width="5"/>
 <path d="M95 148h335M104 232h313" stroke="#d1c0a2" stroke-opacity=".22" stroke-width="2"/>
 <path d="M445 126h6v109h-6z" fill="#de9d48" opacity=".72"/>
 <!-- Linear forecast channel: the passage of time is ONE continuous rectangular rail. -->
 <rect x="482" y="143" width="621" height="76" rx="6" fill="#080f14" stroke="#8f795c" stroke-width="6"/>
 <rect x="492" y="153" width="601" height="56" rx="2" fill="#18242a" stroke="#536269" stroke-opacity=".7" stroke-width="2"/>
 <path d="M642 151v61M792 151v61M942 151v61" stroke="#b19a75" stroke-width="5" opacity=".72"/>
 <path d="M493 163h599M493 197h599" stroke="#a9b5b9" stroke-opacity=".17" stroke-width="3"/>
 <path d="M488 133h619" stroke="#d1ab6d" stroke-opacity=".52" stroke-width="3"/>
 <path d="M488 228h619" stroke="#14191b" stroke-width="6"/>
 <!-- Four etched rectangular time marks, no stage dots. -->
 <g fill="#c7af8b" font-family="Arial,sans-serif" text-anchor="middle" font-size="23" font-weight="700" letter-spacing="1">
 <text x="560" y="279">6H</text><text x="713" y="279">12H</text><text x="864" y="279">18H</text><text x="1015" y="279">24H</text>
 </g>
 <g stroke="#aa8960" stroke-width="4"><path d="M560 219v17M713 219v17M864 219v17M1015 219v17"/></g>
 <path d="M93 107c60-11 114-3 166-8M480 103c128 4 251-9 385-2M965 103c50-4 105 2 151 9" stroke="#c1cdd1" stroke-width="7" opacity=".26" stroke-linecap="round"/>
 <path d="M132 103l-6 16m17-17-4 15m536-12-7 18m19-17-4 13m383-2-6 16" stroke="#d4e4e8" stroke-width="4" opacity=".28" stroke-linecap="round"/>
 <g fill="#aa8e65" stroke="#15181a" stroke-width="2">
 <circle cx="70" cy="145" r="5"/><circle cx="1131" cy="145" r="5"/><circle cx="128" cy="103" r="5"/><circle cx="1078" cy="103" r="5"/><circle cx="114" cy="243" r="5"/><circle cx="1088" cy="245" r="5"/>
 </g>
</g>
</svg>