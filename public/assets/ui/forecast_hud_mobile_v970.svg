 <path d="M629 137h310M630 341h308" stroke="#c3ac86" stroke-opacity=".35" stroke-width="2"/>
 <rect x="643" y="242" width="282" height="35" rx="4" fill="#060d13" stroke="#978062" stroke-width="3"/>
