<!-- The metal side panels are vertically compacted; the round central instrument
     is instead scaled uniformly on both axes to preserve its round geometry. -->
<g filter="url(#shade)" transform="translate(250 0) scale(.5)">
<!-- The original central current-weather circular instrument remains unchanged in concept. -->
