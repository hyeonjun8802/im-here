<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" role="img" aria-label="Mobile AFTERDAY premium industrial weather observatory">
<defs>
 <linearGradient id="metal" x2="0" y2="1"><stop stop-color="#778589"/><stop offset=".11" stop-color="#344348"/><stop offset=".51" stop-color="#111b22"/><stop offset=".85" stop-color="#343d40"/><stop offset="1" stop-color="#10191e"/></linearGradient>
 <linearGradient id="brass"><stop stop-color="#594332"/><stop offset=".2" stop-color="#e7be82"/><stop offset=".4" stop-color="#745437"/><stop offset=".65" stop-color="#d0a369"/><stop offset=".87" stop-color="#816144"/><stop offset="1" stop-color="#e1b377"/></linearGradient>
 <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#34434a"/><stop offset=".2" stop-color="#15232b"/><stop offset=".7" stop-color="#0b171e"/><stop offset="1" stop-color="#243137"/></linearGradient>
 <radialGradient id="dial"><stop stop-color="#344952"/><stop offset=".7" stop-color="#14222b"/><stop offset="1" stop-color="#070e13"/></radialGradient>
 <filter id="shade" x="-20%" y="-25%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="9" flood-opacity=".83"/></filter>
