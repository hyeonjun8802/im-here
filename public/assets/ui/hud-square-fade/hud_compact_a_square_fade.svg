 <rect x="0" y="73.5" width="1000" height="90.3" fill="#b8d8e4" filter="url(#grain)" opacity=".38"/>
 <rect x="0" y="74.61" width="1000" height="88.09" fill="none" stroke="url(#trim)" stroke-width="2.65"/>
 <path d="M0 73.5H1000M0 163.8H1000" fill="none" stroke="#78909a" stroke-opacity=".22" stroke-width="1.27"/>
</g>
