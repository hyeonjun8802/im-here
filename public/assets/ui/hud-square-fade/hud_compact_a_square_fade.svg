<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-label="Square end fantasy HUD, muted copper trim fading towards edges">
<defs>
 <linearGradient id="stone" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#294557"/><stop offset=".12" stop-color="#0b2030"/><stop offset=".58" stop-color="#081826"/><stop offset="1" stop-color="#294557"/></linearGradient>
 <linearGradient id="window" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#06111d"/><stop offset=".5" stop-color="#081725"/><stop offset="1" stop-color="#172b3a"/></linearGradient>
 <radialGradient id="dial"><stop stop-color="#071524"/><stop offset=".65" stop-color="#0a2335"/><stop offset="1" stop-color="#203848"/></radialGradient>
 <linearGradient id="trim" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9a8a78" stop-opacity=".60"/><stop offset=".25" stop-color="#3e5764" stop-opacity=".32"/><stop offset=".75" stop-color="#506675" stop-opacity=".35"/><stop offset="1" stop-color="#956b4b" stop-opacity=".47"/></linearGradient>
 <linearGradient id="sideFade"><stop stop-color="white" stop-opacity="0"/><stop offset=".065" stop-color="white" stop-opacity=".9"/><stop offset=".14" stop-color="white"/><stop offset=".86" stop-color="white"/><stop offset=".935" stop-color="white" stop-opacity=".9"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
 <radialGradient id="ember" cx="50%" cy="100%" r="73%"><stop stop-color="#ffb765" stop-opacity=".84"/><stop offset=".18" stop-color="#ba672e" stop-opacity=".42"/><stop offset=".46" stop-color="#5f3c2e" stop-opacity=".12"/><stop offset="1" stop-color="#0c1e2d" stop-opacity="0"/></radialGradient>
 <filter id="grain" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".02 .12" numOctaves="2" seed="11"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".055"/></feComponentTransfer></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="2.76"/></filter>
 <mask id="fade"><rect width="1000" height="210" fill="url(#sideFade)"/></mask>
</defs>
<!-- Outer panel has true 90-degree corners. Outer 6.5% of width softly disappears. -->
<g mask="url(#fade)">
