 <linearGradient id="stone" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#294557"/><stop offset=".12" stop-color="#0b2030"/><stop offset=".58" stop-color="#081826"/><stop offset="1" stop-color="#294557"/></linearGradient>
 <linearGradient id="window" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#06111d"/><stop offset=".5" stop-color="#081725"/><stop offset="1" stop-color="#172b3a"/></linearGradient>
 <radialGradient id="dial"><stop stop-color="#071524"/><stop offset=".65" stop-color="#0a2335"/><stop offset="1" stop-color="#203848"/></radialGradient>
 <linearGradient id="trim" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9a8a78" stop-opacity=".60"/><stop offset=".25" stop-color="#3e5764" stop-opacity=".32"/><stop offset=".75" stop-color="#506675" stop-opacity=".35"/><stop offset="1" stop-color="#956b4b" stop-opacity=".47"/></linearGradient>
