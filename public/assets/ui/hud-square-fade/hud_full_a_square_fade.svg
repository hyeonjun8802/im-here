 <rect x="0" y="124.34" width="1700" height="146.82" fill="none" stroke="url(#trim)" stroke-width="4.42"/>
 <path d="M0 122.5H1700M0 273H1700" fill="none" stroke="#78909a" stroke-opacity=".22" stroke-width="2.12"/>
</g>
